# Smoke test déclenché sur push d'un tag `v*` (qui arrive habituellement
# depuis GitLab via le push mirror configuré dans Settings → Repository).
#
# Le but est de valider la chaîne complète avant de câbler les vrais builds
# multi-plateformes : GitLab tag → mirror → GitHub trigger → Flutter prêt.
#
# Pour tester manuellement sans repasser par GitLab, on garde aussi un
# `workflow_dispatch` : depuis l'onglet Actions tu peux lancer ce workflow
# à la main sur n'importe quelle branche/tag pour vérifier l'env Flutter.
name: Tag smoke test

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Annule un run en cours si un nouveau tag est poussé entre-temps.
# Les tags étant immutables côté git, ce cas arrive surtout quand on
# re-tag rapidement pour corriger une erreur.
concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke test (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Affiche les infos du trigger
        # Confirme visuellement dans les logs GHA que le tag a bien transité
        # par le mirror. Si ce step ne s'exécute pas du tout, le problème
        # est en amont (mirror pas configuré, tag exclu par une option type
        # "Mirror only protected branches", PAT GitHub expiré, etc.).
        run: |
          echo "Tag        : ${{ github.ref_name }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Ref        : ${{ github.ref }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Event      : ${{ github.event_name }}"

      - name: Checkout du code au tag
        uses: actions/checkout@v4

      - name: Setup Flutter
        # Même version que `codemagic.yaml` pour garder des builds reproductibles
        # entre les deux pipelines tant que la migration n'est pas finalisée.
        # `cache: true` met en cache l'SDK Flutter + ~/.pub-cache → builds suivants
        # beaucoup plus rapides.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        # Pas de `--fatal-infos` : on s'aligne sur ce que `analysis_options.yaml`
        # déclare. Si tu veux durcir la CI plus tard, ajouter ici.
        run: flutter analyze

      - name: flutter test
        # `flutter test` retourne 0 même sans dossier `test/`, donc ce step
        # passe silencieusement tant qu'aucune suite n'est ajoutée.
        run: flutter test
