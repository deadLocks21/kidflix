# Workflow de release consolidé, déclenché sur push d'un tag `v*`.
# Couvre iOS, Android, Windows, Linux et macOS en parallèle + uploads stores +
# création GitHub Release.
#
# Note macOS : PAS de distribution App Store. macOS n'est distribué qu'en canal
# DIRECT (build-macos : .app Developer ID notarisé, consommé par
# tool/updater), au même titre que Windows/Linux.
#
# Pipeline "fail-fast au build (gate strict) → GitHub Release → stores" :
#
#   1) prepare        Calcule la version (depuis le tag ou pubspec.yaml).
#
#   2) Builds parallèle (gate strict) :
#        build-ios          → IPA signé (artifact) puis TestFlight — pas attaché
#                             à la GitHub Release (signé App Store, non sideloadable)
#        build-android      → AAB signé (artifact → Play Store, pas attaché à la
#                             GitHub Release) + APK universel (sideload, attaché)
#        build-windows      → .zip non signé
#        build-linux        → .AppImage
#        build-macos        → .app Developer ID notarisé (hors App Store)
#        build-updater      → binaires updater Win/Linux/macOS (matrice, tool/updater)
#      Si UN SEUL plante, aucun upload store n'est tenté.
#
#   3) build-gate     Job sentinelle qui vérifie que TOUS les builds sont verts —
#                     dont l'app macOS (build-macos) et l'updater (build-updater,
#                     matrice qui inclut macOS).
#
#   4) release        Crée la GitHub Release dès le gate franchi — sans attendre
#                     les stores (qui coûtent jusqu'à 90 min de processing Apple).
#                     Assets attachés : apps desktop (Windows, Linux, macOS),
#                     installateur + binaires updater, et l'APK universel.
#                     PAS l'AAB ni l'IPA (non installables directement, déjà
#                     publiés sur les stores) — cf. le contrat de nommage des
#                     assets documenté dans le job.
#                     Notes = changelog semantic-release relu depuis le corps
#                     du commit `chore(release)` taggé (PAS le message
#                     générique de `release_notes.json`, réservé aux stores).
#
#   5) Publishes parallèle (déclenchés APRÈS la GitHub Release) :
#        publish-ios     → TestFlight "Kidflix Internal"
#        publish-android → Play Store piste "internal"
#      Windows, Linux et macOS n'ont pas de store ici (artifacts only).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY,
#   DEVELOPER_ID_APPLICATION_P12_BASE64, DEVELOPER_ID_APPLICATION_PASSWORD,
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS,
#   SIGNOZ_INGEST_URL, SIGNOZ_INGESTION_KEY
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Configuration Signoz partagée entre toutes les plateformes. Injectée dans
# chaque binaire via `--dart-define` à la compilation (cf.
# `lib/infrastructure/providers/logger.service_provider.dart` qui lit
# `String.fromEnvironment('SIGNOZ_INGEST_URL')`). Sans ces valeurs, l'app
# retombe sur ConsoleLoggerService → pas de remontée Signoz côté users.
#
# `SIGNOZ_INGEST_URL` vient du secret du même nom (instance self-hosted →
# l'URL n'est pas codée en dur ici). Il est mappé dans le bloc `env:` de
# chaque job de build, à côté de `SIGNOZ_INGESTION_KEY`.
env:
  SIGNOZ_ENV: "production"

jobs:
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extrait la version depuis le tag (ou pubspec.yaml)
        # Tag `v1.2.3` → 1.2.3. Pour `workflow_dispatch` (lancement manuel
        # sans tag), on retombe sur la version de `pubspec.yaml`.
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  # ═══════════════════════════════════════════════════════════════════════
  # BUILDS — Compilation + signature + upload artifact (pas de publish)
  # ═══════════════════════════════════════════════════════════════════════

  build-ios:
    name: Build iOS (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      BUNDLE_ID: "fr.dtfh.kidflix"
      APP_STORE_APPLE_ID: "6769453662"
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3 (iOS 26 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Initialize keychain
        run: keychain initialize

      - name: Fetch signing files (create if missing)
        run: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add certificates to keychain
        run: keychain add-certificates

      - name: Set up code signing on Xcode project
        run: xcode-project use-profiles

      - run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        run: find . -name "Podfile" -execdir pod install \;

      - name: Compute build number from App Store Connect
        id: build-number
        run: |
          LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
          BUILD_NUMBER=$((LATEST_BUILD + 1))
          echo "Next iOS build number: $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build IPA
        env:
          SIGNOZ_INGEST_URL: ${{ secrets.SIGNOZ_INGEST_URL }}
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build ipa --release \
            --build-name="$VERSION" \
            --build-number="${{ steps.build-number.outputs.build_number }}" \
            --dart-define=APP_VERSION="$VERSION+${{ steps.build-number.outputs.build_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV" \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidflix-ios
          path: build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload xcodebuild logs (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-ios
          path: /tmp/xcodebuild_logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  build-android:
    name: Build Android (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PACKAGE_NAME: "fr.dtfh.kidflix"
      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Décoder le keystore upload
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/upload-keystore.jks"

      - name: Écrire android/key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks
          EOF

      - run: flutter pub get

      - name: Compute build number from Google Play
        id: build-number
        run: |
          LATEST_BUILD=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials "@env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" \
            --tracks production beta alpha internal 2>/dev/null || echo 0)
          BUILD_NUMBER=$((${LATEST_BUILD:-0} + 1))
          echo "Next Android build number: $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build App Bundle (.aab)
        env:
          SIGNOZ_INGEST_URL: ${{ secrets.SIGNOZ_INGEST_URL }}
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION" \
            --build-number="${{ steps.build-number.outputs.build_number }}" \
            --dart-define=APP_VERSION="$VERSION+${{ steps.build-number.outputs.build_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV"

      - name: Build APK (.apk)
        # APK universel attaché à la GitHub Release pour install directe /
        # sideload. Le Play Store reçoit l'AAB (cf. job publish-android) ;
        # l'APK ne sert qu'à la distribution hors store. Mêmes `--dart-define`.
        env:
          SIGNOZ_INGEST_URL: ${{ secrets.SIGNOZ_INGEST_URL }}
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ steps.build-number.outputs.build_number }}" \
            --dart-define=APP_VERSION="$VERSION+${{ steps.build-number.outputs.build_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV"

      # `flutter build apk` sort un `app-release.apk` générique : on le renomme
      # au schéma d'assets de la Release (cf. job release) avant l'upload, pour
      # que le nom de l'artifact soit déjà le nom final.
      - name: Renomme l'APK au schéma kidflix-android-<version>.apk
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/kidflix-android-${VERSION}.apk"

      - name: Upload AAB + APK + mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidflix-android
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  # BUILD macOS — .app signé Developer ID + notarisé, zippé (ditto), attaché à
  # la GitHub Release. C'est l'UNIQUE canal de distribution macOS (plus d'App
  # Store), consommé par l'updater (tool/updater) : l'équivalent macOS du .zip
  # Windows / de l'AppImage. Deux propriétés clés :
  #   - PAS de sandbox (entitlements DirectRelease.entitlements) : l'app doit
  #     piloter la fenêtre de MAJ via des fichiers hors container ;
  #   - signature « Developer ID Application », puis notarisation Apple → aucune
  #     alerte Gatekeeper au téléchargement.
  #
  # ⚠️ Secrets à ajouter EN PLUS de l'App Store Connect (Settings → Secrets) :
  #   DEVELOPER_ID_APPLICATION_P12_BASE64  — cert « Developer ID Application » (.p12 en base64)
  #   DEVELOPER_ID_APPLICATION_PASSWORD    — mot de passe du .p12
  # La notarisation réutilise la clé APP_STORE_CONNECT_* déjà présente (notarytool).
  # ────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Initialize keychain
        run: keychain initialize

      - name: Add Developer ID Application certificate to keychain
        # Cert account-wide (pas lié à un bundle ID) → importé depuis un secret
        # base64.
        run: |
          P12="$RUNNER_TEMP/developer_id.p12"
          echo "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$P12"
          keychain add-certificates \
            -c "$P12" \
            --certificate-password=@env:DEVELOPER_ID_APPLICATION_PASSWORD
          security find-identity -v -p codesigning

      - run: flutter pub get

      - name: Cache CocoaPods (macOS)
        uses: actions/cache@v4
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-macos-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: pods-macos-${{ runner.os }}-

      - name: Install CocoaPods dependencies (macOS)
        run: |
          cd macos
          pod install

      - name: Build macOS release (non signé — on re-signe Developer ID ensuite)
        # On désactive la signature au build (sinon xcodebuild échoue faute de
        # profil : ce job n'utilise PAS `xcode-project use-profiles`). On signe
        # nous-mêmes juste après, avec le cert Developer ID + les entitlements
        # non-sandbox. L'ajout au .xcconfig est éphémère (checkout jetable).
        env:
          SIGNOZ_INGEST_URL: ${{ secrets.SIGNOZ_INGEST_URL }}
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          cat >> macos/Runner/Configs/Release.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF

          flutter build macos --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION+${{ github.run_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV"

      - name: Sign (Developer ID + hardened runtime, non-sandbox), notarize, staple, zip
        run: |
          set -euo pipefail

          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found"; ls -la build/macos/Build/Products/Release/ || true; exit 1
          fi

          IDENTITY=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+[A-F0-9]+[[:space:]]+"(.*)"$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: no Developer ID Application identity"; security find-identity -v; exit 1
          fi
          ENT="macos/Runner/DirectRelease.entitlements"

          # Signer les binaires imbriqués (frameworks, dylibs) AVANT le bundle,
          # tous en hardened runtime (`--options runtime`, requis par notarytool).
          find "$APP/Contents/Frameworks" -name '*.dylib' -type f -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"
              done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -type d -print0 2>/dev/null \
            | while IFS= read -r -d '' fw; do
                codesign --force --options runtime --timestamp --sign "$IDENTITY" "$fw"
              done

          codesign --force --options runtime --timestamp \
            --entitlements "$ENT" --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          ZIP="kidflix-macos-${VERSION}.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"

          # Notarisation via la clé App Store Connect (écrite dans un .p8 temporaire).
          KEY="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"
          xcrun notarytool submit "$ZIP" \
            --key "$KEY" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          # Staple le ticket SUR le .app (impossible sur un .zip), puis re-zippe :
          # l'app se lance ainsi même hors-ligne, sans vérification en ligne.
          xcrun stapler staple "$APP"
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "MACOS_ZIP=$PWD/$ZIP" >> "$GITHUB_ENV"

      - name: Upload macOS direct artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidflix-macos
          path: ${{ env.MACOS_ZIP }}
          retention-days: 14
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        env:
          SIGNOZ_INGEST_URL: ${{ secrets.SIGNOZ_INGEST_URL }}
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build windows --release `
            --build-name="$env:VERSION" `
            --build-number="${{ github.run_number }}" `
            --dart-define=APP_VERSION="$env:VERSION+${{ github.run_number }}" `
            --dart-define=SIGNOZ_INGEST_URL="$env:SIGNOZ_INGEST_URL" `
            --dart-define=SIGNOZ_INGESTION_KEY="$env:SIGNOZ_INGESTION_KEY" `
            --dart-define=SIGNOZ_ENV="$env:SIGNOZ_ENV"

      - name: Zip Windows build output
        # Le .exe dépend des DLL Flutter et du dossier `data/` côte à côte
        # → on zippe tout le dossier Release pour un archive autonome.
        shell: pwsh
        run: |
          $zipName = "kidflix-windows-$env:VERSION.zip"
          $sourceDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $sourceDir)) {
            Write-Error "Build output directory not found: $sourceDir"
            exit 1
          }
          Compress-Archive -Path "$sourceDir/*" -DestinationPath $zipName
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidflix-windows
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ needs.prepare.outputs.version }})
    needs: prepare
    # ubuntu-22.04 (glibc 2.35) plutôt que ubuntu-latest (24.04 / glibc 2.39)
    # pour rester compatible avec les distros utilisateur un peu plus anciennes.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            clang \
            cmake \
            pkg-config \
            liblzma-dev \
            libasound2-dev \
            libmpv-dev \
            imagemagick

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - run: flutter pub get

      - name: Build Linux release
        env:
          SIGNOZ_INGEST_URL: ${{ secrets.SIGNOZ_INGEST_URL }}
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build linux --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION+${{ github.run_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV"

      - name: Assemble AppDir
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          # AppRun maison, passé à linuxdeploy via `--custom-apprun`. Deux
          # dossiers de libs cohabitent et doivent TOUS DEUX être exposés :
          #   usr/bin/lib  libs Flutter (embedder, libapp.so, plugins) — layout
          #                imposé par le bundle, rpath `$ORIGIN/lib`.
          #   usr/lib      libs système déployées par linuxdeploy (libmpv & co).
          # Passer par LD_LIBRARY_PATH plutôt que de dépendre du rpath rend le
          # lancement insensible à une éventuelle réécriture par patchelf.
          cat > AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$HERE/usr/lib:${LD_LIBRARY_PATH}"
          # media_kit charge libmpv DEUX fois, par deux chemins distincts :
          #   - côté natif, `libmedia_kit_video_plugin.so` porte un NEEDED en
          #     dur sur `libmpv.so.1` (soname du runner 22.04 qui l'a compilé),
          #     satisfait par la copie embarquée ci-dessus ;
          #   - côté Dart, `MediaKit.ensureInitialized()` sonde les noms dans
          #     l'ordre `libmpv.so`, `libmpv.so.2`, `libmpv.so.1`. Les deux
          #     premiers sont absents de l'AppImage, donc la recherche sort du
          #     LD_LIBRARY_PATH et trouve la libmpv.so.2 de l'HÔTE (mpv >= 0.36,
          #     soit toute distro récente).
          # Le handle mpv créé côté Dart était alors passé au render context de
          # l'autre libmpv : layouts de structs incompatibles, segfault à la
          # première frame. On force le côté Dart sur le fichier exact que le
          # plugin natif a déjà chargé.
          export LIBMPV_LIBRARY_PATH="$HERE/usr/lib/libmpv.so.1"
          # Met le thème d'icônes embarqué à portée de GTK : sans ça, le
          # `gtk_window_set_default_icon_name("kidflix")` du runner ne résout
          # rien et la fenêtre reste sans icône.
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          cd "$HERE/usr/bin" && exec ./kidflix "$@"
          EOF
          chmod +x AppRun

          cat > kidflix.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Kidflix
          Comment=Kidflix — visionnage familial
          Exec=kidflix
          Icon=kidflix
          Categories=AudioVideo;Video;Player;
          Terminal=false
          StartupWMClass=fr.dtfh.kidflix
          EOF

          # 256×256 : taille hicolor standard, listée dans les index.theme
          # système. L'original fait 1024×1024, une taille qu'aucun index.theme
          # ne déclare — GTK ignorerait purement et simplement le répertoire.
          convert assets/icon/app_icon.png -resize 256x256 kidflix.png

      - name: Download linuxdeploy
        # Noms canoniques conservés : linuxdeploy découvre ses plugins par le
        # motif `linuxdeploy-plugin-<nom>*` dans son propre dossier ou le PATH.
        run: |
          wget -q -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-appimage-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Build AppImage
        env:
          # linuxdeploy et son plugin sont eux-mêmes des AppImages, qui
          # requièrent FUSE2 pour s'auto-monter. Sur GHA, FUSE n'est pas dispo.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Schéma d'assets `kidflix-<plateforme>-<version>` (cf. job release) ;
          # le suffixe `-x86_64.AppImage` est ce que matchent les updaters déjà
          # installés (tool/updater/lib/github.dart) — à ne pas retirer.
          APPIMAGE_NAME="kidflix-linux-${VERSION}-x86_64.AppImage"

          # Résolu via ldconfig plutôt qu'en dur : si un jour le runner ne
          # fournit plus libmpv.so.1, on veut échouer ICI avec un message clair
          # plutôt que de publier une AppImage cassée.
          LIBMPV=$(ldconfig -p | awk '/libmpv\.so\.1 / {print $NF; exit}')
          if [ -z "$LIBMPV" ]; then
            echo "::error::libmpv.so.1 introuvable sur le runner (libmpv-dev installé ?)"
            exit 1
          fi
          echo "libmpv déployée depuis $LIBMPV"

          # `--library libmpv` : media_kit ne bundle RIEN sur Linux (son
          # `media_kit_libs_linux_bundled_libraries` est vide) — libmpv est une
          # dépendance système, présente ici uniquement parce que la CI installe
          # `libmpv-dev` pour compiler. Sans ce déploiement explicite, l'AppImage
          # sort avec un `NEEDED libmpv.so.1` que l'hôte doit satisfaire… ce
          # qu'Ubuntu 24.04 ne peut plus faire (il n'expose que libmpv.so.2,
          # soname bumpé par mpv 0.36). linuxdeploy embarque libmpv et tout son
          # arbre (ffmpeg, libass, …) en respectant l'excludelist AppImage, qui
          # laisse à l'hôte ce qui doit lui rester (libGL, X11, glibc, GTK).
          #
          # `--executable` pointe le binaire du BUNDLE, pas sa copie déjà dans
          # l'AppDir : linuxdeploy le (re)copie et patche son rpath, sans risque
          # de copie source==destination.
          ARCH=x86_64 OUTPUT="$APPIMAGE_NAME" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/linux/x64/release/bundle/kidflix \
            --library "$LIBMPV" \
            --desktop-file kidflix.desktop \
            --icon-file kidflix.png \
            --custom-apprun AppRun \
            --output appimage

          echo "APPIMAGE_NAME=$APPIMAGE_NAME" >> "$GITHUB_ENV"

      - name: Verify the AppImage is self-contained
        # Garde-fou contre la régression qui a motivé linuxdeploy : on extrait
        # l'AppImage dans une Ubuntu 24.04 nue — donc sans libmpv — et on exige
        # que tout se résolve. Le conteneur reçoit ce qu'un vrai bureau fournit
        # (GTK, ALSA, pile graphique Mesa) : ces libs sont volontairement NON
        # embarquées, l'excludelist AppImage les laisse à l'hôte car elles sont
        # couplées à son driver. Sans elles, le test crierait au loup.
        #
        # Le script passe par stdin (`-s`) plutôt que par `-c '…'` : il peut
        # ainsi contenir des apostrophes.
        run: |
          docker run --rm -i -v "$PWD:/w" -w /w -e APPIMAGE="$APPIMAGE_NAME" \
            ubuntu:24.04 bash -euo pipefail -s <<'IN_CONTAINER'
          apt-get update -qq
          apt-get install -y -qq \
            libgtk-3-0t64 libasound2t64 \
            libgl1 libegl1 libgbm1 libdrm2 libx11-xcb1 >/dev/null

          ./"$APPIMAGE" --appimage-extract >/dev/null
          export LD_LIBRARY_PATH=squashfs-root/usr/bin/lib:squashfs-root/usr/lib

          # L'assertion qui compte : c'est très exactement le bug d'origine.
          test -f squashfs-root/usr/lib/libmpv.so.1 || {
            echo "::error::libmpv.so.1 n'est pas embarquée dans l'AppImage"
            exit 1
          }

          # Backends optionnels, absents d'un bureau standard et sans rapport
          # avec la lecture vidéo : JACK (sortie audio alternative de
          # ffmpeg/mpv), libusb via libdc1394 (caméras IIDC de libavdevice),
          # libjvm via libdartjni (package `jni`, transitif Android).
          OPTIONAL='libjack\.so\.0|libusb-1\.0\.so\.0|libjvm\.so'

          missing=$(
            for f in squashfs-root/usr/bin/kidflix \
                     squashfs-root/usr/bin/lib/*.so* \
                     squashfs-root/usr/lib/*.so*; do
              [ -f "$f" ] || continue
              ldd "$f" 2>/dev/null | grep "not found" | grep -Ev "$OPTIONAL" \
                | sed "s|^|$(basename "$f") -> |" || true
            done | sort -u
          )
          if [ -n "$missing" ]; then
            echo "::error::AppImage non autonome, dépendances manquantes :"
            echo "$missing"
            exit 1
          fi

          echo "libmpv.so.1 embarquée, et toutes les dépendances se résolvent."
          rm -rf squashfs-root
          IN_CONTAINER

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidflix-linux
          path: ${{ env.APPIMAGE_NAME }}
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────
  # UPDATER — Binaire installateur/launcher/auto-updater (Windows, Linux, macOS).
  # Indépendant des builds d'app : c'est un petit CLI Dart (tool/updater)
  # attaché à la release pour que l'utilisateur le télécharge une seule fois.
  # Bootstrap : téléchargé UNE fois, ensuite il met à jour l'app ET lui-même.
  #
  # macOS : on ne distribue PAS le binaire nu (téléchargé via navigateur il
  # serait tué par Gatekeeper — un exécutable nu ne peut pas être « staplé »).
  # Étapes supplémentaires (gardées par `if: runner.os == 'macOS'`) : on l'emballe
  # dans « Kidflix Installer.app », signé Developer ID + notarisé + STAPLÉ, zippé
  # via ditto. Un .app staplé passe Gatekeeper au double-clic, hors-ligne. Secrets
  # DEVELOPER_ID_APPLICATION_* + APP_STORE_CONNECT_*.
  # ───────────────────────────────────────────────────────────────────────

  build-updater:
    name: Build Updater (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            out: kidflix-updater-windows.exe
            artifact: kidflix-updater-windows
          - os: ubuntu-22.04
            label: Linux
            out: kidflix-updater-linux
            artifact: kidflix-updater-linux
          - os: macos-15
            label: macOS
            out: kidflix-updater-macos
            artifact: kidflix-updater-macos

    env:
      # Utilisés uniquement par les étapes macOS (ignorés sur Win/Linux).
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.5"

      # ── macOS uniquement : Xcode + import du cert Developer ID ──────────────
      - name: Select Xcode 26.3
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Setup Python (requis par codemagic-cli-tools)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        if: runner.os == 'macOS'
        run: pip install codemagic-cli-tools

      - name: Initialize keychain
        if: runner.os == 'macOS'
        run: keychain initialize

      - name: Add Developer ID Application certificate to keychain
        if: runner.os == 'macOS'
        run: |
          P12="$RUNNER_TEMP/developer_id.p12"
          echo "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$P12"
          keychain add-certificates \
            -c "$P12" \
            --certificate-password=@env:DEVELOPER_ID_APPLICATION_PASSWORD

      - name: Resolve updater deps
        working-directory: tool/updater
        run: dart pub get

      # CLI console autonome (pas de Flutter) : `dart compile exe` produit un
      # binaire natif. Les lancements quotidiens passent par un wrapper caché
      # (VBS Windows / .desktop Linux / .app lanceur macOS) généré à l'installation.
      - name: Compile updater
        working-directory: tool/updater
        run: dart compile exe bin/kidflix_updater.dart -o "${{ matrix.out }}"

      # macOS : emballe le binaire dans « Kidflix Installer.app », signé
      # Developer ID + hardened runtime, notarisé ET STAPLÉ (possible sur un .app,
      # pas sur un binaire nu). C'est l'artefact que l'utilisateur télécharge :
      # un .app staplé passe Gatekeeper au double-clic, hors-ligne, sans `xattr`.
      # `--options runtime` requis par notarytool — et, avec lui, l'entitlement
      # `allow-unsigned-executable-memory` (macos/Installer.entitlements) SANS
      # LEQUEL le binaire Dart AOT est tué au démarrage par le noyau
      # (SIGKILL / CODESIGNING « Invalid Page ») : `dart compile exe` remappe son
      # snapshot en mémoire anonyme exécutable. Cf. le commentaire du fichier.
      - name: Package installer .app (Developer ID + notarize + staple) (macOS)
        if: runner.os == 'macOS'
        working-directory: tool/updater
        run: |
          set -euo pipefail
          APP="Kidflix Installer.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "${{ matrix.out }}" "$APP/Contents/MacOS/kidflix-installer"
          chmod +x "$APP/Contents/MacOS/kidflix-installer"

          # SECONDE copie du MÊME binaire, signée en autonome plus bas. C'est
          # elle que l'installateur relocalise dans `<root>/updater/` et que
          # l'auto-MAJ extrait — cf. _relocatableBinary() dans lib/installer.dart.
          # L'exécutable principal, lui, se fait sceller le hash de l'Info.plist
          # par la signature du BUNDLE : copié hors de Contents/MacOS/ il devient
          # invalide et le hardened runtime le tue au démarrage.
          cp "${{ matrix.out }}" "$APP/Contents/Resources/kidflix-updater"
          chmod +x "$APP/Contents/Resources/kidflix-updater"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleName</key><string>Kidflix Installer</string>
          <key>CFBundleDisplayName</key><string>Kidflix Installer</string>
          <key>CFBundleIdentifier</key><string>fr.dtfh.kidflix.installer</string>
          <key>CFBundleExecutable</key><string>kidflix-installer</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Icône (best-effort) depuis l'icône de l'app.
          ICON_SRC="$GITHUB_WORKSPACE/assets/icon/app_icon.png"
          if [ -f "$ICON_SRC" ]; then
            mkdir -p AppIcon.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s "$ICON_SRC" --out "AppIcon.iconset/icon_${s}x${s}.png" >/dev/null 2>&1 || true
              d=$((s * 2)); sips -z $d $d "$ICON_SRC" --out "AppIcon.iconset/icon_${s}x${s}@2x.png" >/dev/null 2>&1 || true
            done
            iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns" 2>/dev/null || true
          fi

          IDENTITY=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+[A-F0-9]+[[:space:]]+"(.*)"$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: no Developer ID Application identity"; security find-identity -v; exit 1
          fi

          # Signer le binaire interne PUIS le bundle (hardened runtime +
          # entitlements). Le binaire interne DOIT porter les entitlements : à
          # l'auto-MAJ, l'updater l'extrait du .app et l'exécute nu.
          # ORDRE IMPORTANT : la copie relocalisable D'ABORD et SEULE (contexte
          # hors-bundle → aucun Info.plist scellé dans sa signature), puis
          # l'exécutable principal, puis le bundle. Signer le bundle re-signe
          # son exécutable principal mais PAS un Mach-O rangé dans Resources/ :
          # la copie autonome survit donc intacte.
          ENT="macos/Installer.entitlements"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENT" --sign "$IDENTITY" "$APP/Contents/Resources/kidflix-updater"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENT" --sign "$IDENTITY" "$APP/Contents/MacOS/kidflix-installer"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENT" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Garde-fous. Le CI restait vert avec un artefact mort-né parce qu'il
          # ne lançait jamais rien : on exécute donc pour de vrai les DEUX
          # chemins, chacun ayant son mode de mort propre.
          #  1. le .app au double-clic (1re install) : tué sans l'entitlement.
          #  2. la copie relocalisée hors du bundle (lancement quotidien via
          #     ~/Applications/Kidflix.app, et auto-MAJ) : tuée si elle porte
          #     une signature de bundle.
          codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | grep -q 'allow-unsigned-executable-memory' \
            || { echo "ERROR: entitlement allow-unsigned-executable-memory absent"; exit 1; }
          "$APP/Contents/MacOS/kidflix-installer" --check

          RELOC="$RUNNER_TEMP/reloc-check/kidflix-updater"
          mkdir -p "$(dirname "$RELOC")"
          cp "$APP/Contents/Resources/kidflix-updater" "$RELOC"
          chmod +x "$RELOC"
          codesign --verify --strict "$RELOC" \
            || { echo "ERROR: la copie relocalisée a une signature invalide hors bundle"; exit 1; }
          "$RELOC" --check

          # Notariser le .app puis STAPLER le ticket → lancement hors-ligne OK.
          KEY="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"
          ditto -c -k --keepParent "$APP" "installer-unstapled.zip"
          xcrun notarytool submit "installer-unstapled.zip" \
            --key "$KEY" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"

          ZIP="kidflix-installer-macos-${VERSION}.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "INSTALLER_ZIP=tool/updater/$ZIP" >> "$GITHUB_ENV"

      # Win/Linux : on attache le binaire nu (téléchargé via curl à l'auto-MAJ,
      # jamais mis en quarantaine). macOS a son propre upload (.app) ci-dessous.
      - name: Upload updater artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tool/updater/${{ matrix.out }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload installer .app (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: kidflix-installer-macos
          path: ${{ env.INSTALLER_ZIP }}
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD GATE — Sentinelle qui valide que les builds sont verts
  # ═══════════════════════════════════════════════════════════════════════

  build-gate:
    name: All builds passed
    # TOUS les builds doivent être verts avant publication — dont l'app macOS
    # (build-macos) et l'updater (build-updater, matrice qui inclut macOS). Un
    # échec de signature/notarisation macOS bloque donc tout le pipeline, y
    # compris les publications iOS/Android.
    needs:
      [
        build-ios,
        build-android,
        build-windows,
        build-linux,
        build-macos,
        build-updater,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "✓ Tous les builds sont verts (apps + updater, dont macOS) — publication autorisée"

  # ═══════════════════════════════════════════════════════════════════════
  # PUBLISHES — Uploads stores (déclenchés APRÈS la GitHub Release)
  # ═══════════════════════════════════════════════════════════════════════

  publish-ios:
    name: Publish iOS to TestFlight
    needs: [release]
    # macos-15 obligatoire : `app-store-connect publish` utilise `altool`
    # qui ne tourne que sur macOS (composant de Xcode).
    # 120 min de timeout pour couvrir : upload (~5 min) + Apple processing
    # (5-90 min selon les jours) + assignation au beta group (~10s).
    runs-on: macos-15
    timeout-minutes: 120

    env:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      # Bumpe le timeout interne de `app-store-connect publish` qui attend
      # la fin du processing Apple AVANT d'assigner au beta group. Default
      # codemagic-cli-tools = 20 min, insuffisant les jours où la file
      # d'attente App Store Connect est saturée. À 90 min on couvre 99 %
      # des cas observés.
      APP_STORE_CONNECT_MAX_FIND_BUILD_WAIT: "90"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: kidflix-ios
          path: artifacts/

      - name: Publish to TestFlight (internal beta group)
        run: |
          WHATS_NEW=$(jq -r '.[] | select(.language=="fr-FR") | .text' release_notes.json)
          IPA_PATH=$(find artifacts -type f -name '*.ipa' | head -1)
          echo "Uploading: $IPA_PATH"
          app-store-connect publish \
            --path "$IPA_PATH" \
            --testflight \
            --beta-group "Kidflix Internal" \
            --expire-build-submitted-for-review \
            --locale fr-FR \
            --whats-new "$WHATS_NEW" \
            --max-find-build-wait 90

  publish-android:
    name: Publish Android to Play Store
    needs: [release]
    # ubuntu-latest : `google-play bundles publish` utilise l'API Google
    # directement (pas de dépendance macOS).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: kidflix-android
          path: artifacts/

      - name: Publish to Play Store (internal track)
        run: |
          AAB_PATH=$(find artifacts -type f -name '*.aab' | head -1)
          echo "Uploading: $AAB_PATH"
          google-play bundles publish \
            --credentials "@env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" \
            --bundle "$AAB_PATH" \
            --track internal \
            --release-notes "@file:release_notes_android.json"

  # ═══════════════════════════════════════════════════════════════════════
  # GITHUB RELEASE — Assets installables attachés, dès le gate franchi
  # (AVANT les publications stores, qui en dépendent).
  # ═══════════════════════════════════════════════════════════════════════

  release:
    name: Create GitHub Release
    # Déclenchée dès que le gate est franchi (build-gate = tous les builds verts,
    # dont build-macos) ; build-updater est aussi listé pour attacher ses
    # binaires. La GitHub Release sort AVANT les publications stores, qui en
    # dépendent (publish-* → needs: release) : elle n'attend donc plus les ~90 min
    # de processing Apple.
    # NB : `prepare` DOIT rester dans needs — needs.<job>.outputs n'est exposé
    # qu'aux dépendances directes ; sans lui, needs.prepare.outputs.version est
    # vide et le titre devient « Kidflix v ».
    needs: [prepare, build-gate, build-updater]
    # TEMPORAIRE : condition `if: startsWith(github.ref, 'refs/tags/v')`
    # désactivée pour pouvoir tester le job release via workflow_dispatch
    # sans avoir à tagger. À RESTAURER une fois la validation faite.
    # if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` : le fallback `git describe` (cf. étape "Compose
          # les notes de release") a besoin des tags et de l'historique.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Compose les notes de release
        # semantic-release (côté GitLab CI) génère déjà le changelog
        # conventionnel et l'écrit dans le CORPS du commit
        # `chore(release): X.Y.Z` — celui-là même sur lequel pointe le tag
        # `vX.Y.Z` qui déclenche ce workflow. On le relit ici plutôt que de
        # publier le message générique de `release_notes.json` (qui reste
        # réservé aux stores, cf. jobs publish-*).
        run: |
          set -euo pipefail

          NOTES=""

          # On teste le SUJET, pas le corps : tout commit conventionnel un peu
          # soigné a un corps, donc "corps non vide" ne prouve rien. Seul
          # `chore(release):` garantit que le corps est bien le changelog.
          case "$(git log -1 --format=%s HEAD)" in
            "chore(release):"*) NOTES=$(git log -1 --format=%b HEAD) ;;
          esac

          # Fallback `workflow_dispatch` : HEAD n'est pas un commit de release
          # → on liste les commits depuis le dernier tag.
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            # NB : pas d'apostrophe dans le mot par défaut de `${PREV:-...}`,
            # bash y ré-interprète les quotes même entre guillemets doubles.
            echo "HEAD n'est pas un commit de release — fallback depuis ${PREV:-le premier commit}"
            NOTES=$(git log --no-merges --invert-grep --grep='^chore(release)' \
              --pretty='* %s (%h)' ${PREV:+"$PREV.."}HEAD)
          fi

          # Les liens générés par semantic-release pointent vers `origin`,
          # c'est-à-dire GitLab. Les chemins `/compare/` et `/commit/` sont
          # identiques chez GitHub → un simple swap d'host suffit.
          printf '%s\n' "$NOTES" \
            | sed "s#https://gitlab.com/kidflix/app#$GITHUB_SERVER_URL/$GITHUB_REPOSITORY#g" \
            > notes.md

          echo "--- notes.md ---"
          cat notes.md

      - name: Create GitHub Release
        run: |
          set -euo pipefail

          # Schéma des assets : `kidflix-<plateforme>-<version>.<ext>`, tout en
          # minuscules, sans numéro de run (la version du tag suffit à situer le
          # binaire). Ces noms sont un CONTRAT avec les updaters DÉJÀ INSTALLÉS,
          # qui résolvent les assets de la release `latest` par nom
          # (tool/updater/lib/github.dart) :
          #   - app Windows           `^kidflix-windows-.*\.zip$`
          #   - app macOS             `^kidflix-macos-.*\.zip$`
          #   - app Linux             `x86_64\.AppImage$`
          #   - installateur macOS    `^kidflix-installer-macos-.*\.zip$`
          #   - updater Win/Linux     nom EXACT, non versionné (cible mouvante)
          # Deux pièges : ne jamais renommer l'installateur macOS en
          # `kidflix-macos-installer-*` (il matcherait la regex de l'app), et ne
          # jamais versionner les binaires updater (les installations existantes
          # les cherchent au nom exact pour s'auto-mettre à jour).
          #
          # AAB et IPA ne sont volontairement PAS attachés : ni l'un ni l'autre
          # n'est installable par un utilisateur (l'AAB ne sert qu'au Play Store,
          # l'IPA est signé App Store) et ils sont déjà publiés par les jobs
          # publish-android / publish-ios. L'APK universel, lui, reste attaché
          # pour le sideload.
          #
          # `mapping.txt` EST attaché volontairement : R8 est actif (le plugin
          # Gradle de Flutter l'active par défaut en release), et cette table de
          # désobfuscation est le seul moyen de relire les stack traces des
          # crashs de la version publiée. C'est le seul asset non installable
          # qu'on garde — il ne pèse rien à côté des binaires.
          #
          # On n'attache par ailleurs que les assets réellement présents :
          # certaines plateformes peuvent être désactivées, et passer un
          # argument vide à `gh release create` fait échouer la commande.
          ASSETS=()
          echo "Releasing assets:"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "  - $f"
            ASSETS+=("$f")
          done < <(find artifacts -type f \
            \( -name '*.apk' \
               -o -name 'mapping.txt' \
               -o -name '*.zip' -o -name '*.AppImage' \
               -o -name 'kidflix-updater-windows.exe' \
               -o -name 'kidflix-updater-linux' \) | sort)

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "ERROR: no release assets found"
            exit 1
          fi

          # Tag name : `v<version>` si on est sur un tag, sinon nom synthétique
          # avec run_number pour éviter toute collision avec un tag git existant
          # et pour ne pas créer une release tagged sur un nom de branche
          # (ce qui serait invalide / source de confusion).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="dispatch-v${VERSION}-${{ github.run_number }}"
          fi
          echo "Release tag: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            --title "Kidflix v$VERSION" \
            --notes-file notes.md \
            "${ASSETS[@]}"
